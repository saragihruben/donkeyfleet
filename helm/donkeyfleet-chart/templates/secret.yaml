{{- if .Values.secret.create -}}
# Chart-managed Secret. For production prefer secret.create=false and an
# externally-managed Secret (e.g. External Secrets Operator) named
# secret.existingSecret, so credentials never live in Helm values or history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "donkeyfleet.secretName" . }}
  labels:
    {{- include "donkeyfleet.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-username: {{ required "secret.dbUsername is required when secret.create is true" .Values.secret.dbUsername | quote }}
  db-password: {{ required "secret.dbPassword is required when secret.create is true" .Values.secret.dbPassword | quote }}
  oidc-client-secret: {{ required "secret.oidcClientSecret is required when secret.create is true" .Values.secret.oidcClientSecret | quote }}
{{- end -}}
