{{- if .Values.secret.externalSecret.enabled -}}
# Optional: requires External Secrets Operator (external-secrets.io CRDs) in the
# cluster. Syncs the Secret referenced by secret.existingSecret from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.existingSecret }}
  labels:
    {{- include "donkeyfleet.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secret.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secret.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.secret.existingSecret }}
  data:
    {{- range $key := list "db-username" "db-password" "oidc-client-secret" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.secret.externalSecret.remoteKey }}
        property: {{ $key }}
    {{- end }}
{{- end -}}
