# DonkeyFleet standalone stack for Docker Desktop.
#
# Brings up Postgres + Vault (dev) + Keycloak + DonkeyFleet on one machine, no Kubernetes.
# Everything talks to Keycloak through host.docker.internal so the browser and the app agree
# on the OIDC issuer (the classic Keycloak-in-Docker trap). See README.md.
#
#   docker compose -f docker-compose.yml up -d
#   open http://host.docker.internal:8090   (login: donkey / donkey)

name: donkeyfleet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snapmirror
      POSTGRES_USER: snapmirror
      POSTGRES_PASSWORD: snapmirror
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapmirror -d snapmirror"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Vault in dev mode: auto-unsealed, KV v2 mounted at secret/, one fixed root token.
  # DonkeyFleet authenticates to it with that token (no Kubernetes ServiceAccount here).
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-donkeyfleet-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Optional one-shot: writes a sample cluster credential so you can point a cluster
  # registration at secret/snapmirror/clusters/example. Enable with:
  #   docker compose --profile seed up vault-seed
  vault-seed:
    image: hashicorp/vault:1.18
    profiles: ["seed"]
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_TOKEN:-donkeyfleet-root}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vault kv put secret/snapmirror/clusters/example username=admin password=example-password &&
        echo "seeded secret/snapmirror/clusters/example"
    restart: "no"

  # start-dev + --import-realm loads keycloak/realm-export.json on first boot.
  # KC_HOSTNAME fixes the issuer to host.docker.internal:8081 so the token the browser
  # gets and the token the app validates carry the same iss.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "http://host.docker.internal:8081"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  donkeyfleet:
    # Run a published image. Point DONKEYFLEET_IMAGE at a registry ref you can pull.
    image: ${DONKEYFLEET_IMAGE:-donkeyfleet:1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      # --- Database (bundled Postgres) ---
      DB_URL: "jdbc:postgresql://postgres:5432/snapmirror"
      DB_USERNAME: snapmirror
      DB_PASSWORD: snapmirror
      # --- OIDC (Keycloak reached via host.docker.internal so issuer matches the browser) ---
      OIDC_ISSUER: "http://host.docker.internal:8081/realms/${KC_REALM:-donkeyfleet}"
      OIDC_CLIENT_ID: ${KC_CLIENT_ID:-donkeyfleet}
      OIDC_CLIENT_SECRET: ${KC_CLIENT_SECRET:-donkeyfleet-local-secret}
      QUARKUS_OIDC_ROLES_SOURCE: accesstoken
      QUARKUS_OIDC_ROLES_ROLE_CLAIM_PATH: "realm_access/roles"
      # --- Plain HTTP locally: a force-secure CSRF cookie would never come back ---
      CSRF_COOKIE_SECURE: "false"
      # --- Vault (dev) via direct token auth, no Kubernetes ServiceAccount ---
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_TOKEN:-donkeyfleet-root}
      QUARKUS_VAULT_KV_SECRET_ENGINE_MOUNT_PATH: secret
      # --- Reconcile: safe startup plus fast, crash-recoverable provisioning progress ---
      RECONCILE_INTERVAL: "${RECONCILE_INTERVAL:-5m}"
      PROVISIONING_POLL_INTERVAL: "${PROVISIONING_POLL_INTERVAL:-15s}"
      RECONCILE_DRY_RUN: "${RECONCILE_DRY_RUN:-true}"
      RECONCILE_DRY_RUN_UI_OVERRIDE: "${RECONCILE_DRY_RUN_UI_OVERRIDE:-true}"
      # Local-only: unlocks Infrastructure → Reset all data (wipes the database, keeps audit).
      DEV_RESET_ENABLED: "true"
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
